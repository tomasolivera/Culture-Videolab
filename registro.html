<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — CULTURE VIDEO EXPERIENCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --earth: #8B7355;
            --terracotta: #C17A5C;
            --sand: #E8DCC4;
            --beige: #D4C4A8;
            --cream: #F5F1E8;
            --forest: #1A2F1A;
            --forest-light: #2D4A2D;
            --sage: #9CAF88;
            --white: #FFFFFF;
            --warm-white: #FAF8F3;
            
            --font-body: 'Montserrat', sans-serif;
            --font-elegant: 'Playfair Display', serif;
        }

        body {
            font-family: var(--font-body);
            background: var(--forest);
            color: var(--cream);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hero-bg-image {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(135deg, rgba(193, 122, 92, 0.15) 0%, rgba(212, 196, 168, 0.15) 100%),
                url('https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1920&q=80');
            background-size: cover;
            background-position: center;
            filter: saturate(1.4) brightness(0.7);
        }

        .hero-bg-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(26, 47, 26, 0.5) 0%,
                rgba(26, 47, 26, 0.88) 50%,
                rgba(26, 47, 26, 0.95) 100%
            );
        }

        .registration-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .registration-card {
            background: rgba(26, 47, 26, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .registration-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .registration-title {
            font-family: var(--font-body);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--beige);
            margin-bottom: 0.5rem;
        }

        .registration-subtitle {
            font-family: var(--font-elegant);
            font-size: 1rem;
            font-style: italic;
            color: var(--sage);
        }

        .host-badge {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            background: rgba(193, 122, 92, 0.15);
            border: 1px solid rgba(193, 122, 92, 0.3);
            border-radius: 6px;
            color: var(--terracotta);
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--beige);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(26, 47, 26, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: var(--cream);
            font-family: var(--font-body);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: var(--sage);
        }

        .form-input:hover {
            background: rgba(45, 74, 45, 0.6);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .form-input:focus {
            background: rgba(45, 74, 45, 0.7);
            border-color: var(--beige);
            box-shadow: 0 0 0 3px rgba(212, 196, 168, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.95);
            color: var(--forest);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-top: 1rem;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 1);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-note {
            text-align: center;
            margin-top: 1.5rem;
            font-family: var(--font-body);
            font-size: 0.8rem;
            color: var(--sage);
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .hero {
                padding: 2rem 1.5rem;
            }

            .registration-card {
                padding: 2rem 1.5rem;
            }

            .registration-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-bg">
            <div class="hero-bg-image"></div>
            <div class="hero-bg-overlay"></div>
        </div>

        <div class="registration-container">
            <div class="registration-card">
                <div class="registration-header">
                    <h1 class="registration-title">Datos del Invitado</h1>
                    <p class="registration-subtitle">Completá tus datos para continuar con tu invitación</p>
                    <div class="host-badge">Invitado por: <span id="hostName"></span></div>
                </div>

                <form id="registrationForm">
                    <input type="hidden" id="hostValue" name="host">
                    <input type="hidden" id="invitationId" name="invitationId">

                    <div class="form-group">
                        <label class="form-label" for="firstName">Nombre *</label>
                        <input type="text" class="form-input" id="firstName" name="firstName" required placeholder="Tu nombre">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="lastName">Apellido *</label>
                        <input type="text" class="form-input" id="lastName" name="lastName" required placeholder="Tu apellido">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="dni">DNI *</label>
                        <input type="text" class="form-input" id="dni" name="dni" required placeholder="12345678" maxlength="8">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="whatsapp">WhatsApp *</label>
                        <input type="tel" class="form-input" id="whatsapp" name="whatsapp" required placeholder="3411234567">
                    </div>

                    <button type="submit" class="btn-submit" id="btnSubmit">Continuar al Pago</button>

                    <div class="form-note">
                        Al continuar, aceptás los términos del evento.<br>
                        Tu invitación será verificada por el anfitrión.
                    </div>
                </form>
            </div>
        </div>

    </section>

    <script>
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const hostValue = urlParams.get('host');
        const hostName = urlParams.get('name');

        // Mostrar el nombre del anfitrión
        if (hostName) {
            document.getElementById('hostName').textContent = hostName;
            document.getElementById('hostValue').value = hostValue;
        }

        // El ID ahora es el DNI del invitado
        function generateInvitationId() {
            const dni = document.getElementById('dni').value.trim();
            return dni; // El DNI es el ID
        }

        // Validar que WhatsApp sea solo números
        document.getElementById('whatsapp').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // URL del Google Apps Script Web App
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUt58ue-ZewE8g7v1Bqgc-_PV4r-yKqct9rkjSKTOuI5UtbRjx1wOX2_65OdEaFKFA/exec';

        // Enviar formulario
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Procesando...';
            
            const invitationId = generateInvitationId();
            document.getElementById('invitationId').value = invitationId;

            const formData = {
                invitationId: invitationId,
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                dni: document.getElementById('dni').value.trim(),
                whatsapp: document.getElementById('whatsapp').value.trim(),
                host: hostValue,
                hostName: hostName,
                status: 'Pendiente de Pago',
                timestamp: new Date().toISOString()
            };

            try {
                // Enviar a Google Sheets
                console.log('📤 Enviando datos:', formData);
                
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify(formData)
                });
                
                console.log('✅ Respuesta recibida');

                // Guardar en localStorage para la siguiente página
                localStorage.setItem('invitationData', JSON.stringify(formData));
                
                console.log('✅ Datos guardados, redirigiendo...');
                
                // Pequeño delay para asegurar que el script procese
                setTimeout(() => {
                    window.location.href = `pago.html?id=${invitationId}`;
                }, 800);
                
            } catch (error) {
                console.error('Error:', error);
                // Aún así continuamos al pago (el script seguirá funcionando en background)
                localStorage.setItem('invitationData', JSON.stringify(formData));
                window.location.href = `pago.html?id=${invitationId}`;
            }
        });

        // Validar que DNI sea solo números
        document.getElementById('dni').addEventListener('input', function(e) {
            // Permitir solo números
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
