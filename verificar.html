<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Estado — CULTURE</title>
    <meta name="theme-color" content="#1A2F1A">
    <script>document.documentElement.classList.add('js')</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Montserrat:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/culture.css">
    <style>
        .error-message {
            display: none;
            margin-top: 18px;
            padding: 14px 16px;
            border-left: 4px solid var(--bad);
            background: rgb(194 69 59 / 0.08);
            color: #8f2b23;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .result-box {
            display: none;
            margin-top: 32px;
            animation: fade-up 0.8s var(--ease-expo) both;
        }
        .result-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--rule);
            color: var(--muted);
        }
        .status-badge {
            --h: 36px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            height: var(--h);
            padding: 0 calc(var(--h) * 0.577 + 12px) 0 14px;
            background: var(--ink);
            color: var(--pearl);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: -0.005em;
            clip-path: polygon(0 0, 100% 0, calc(100% - var(--h) * 0.577) 100%, 0 100%);
        }
        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        .status-badge.status-approved { background: var(--ok); color: #fff; }
        .status-badge.status-rejected { background: var(--bad); color: #fff; }
        .status-badge.status-pending { background: var(--accent); color: var(--ink); }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            min-height: 56px;
            padding: 10px 0;
            border-bottom: 1px solid var(--rule);
        }
        .detail-label { color: var(--muted); font-size: 0.95rem; }
        .detail-value {
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.9375rem;
            text-align: right;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
        <div class="container">
            <a class="brand" href="index.html" aria-label="Culture — inicio">
                <span class="logo" role="img" aria-label="CULTURE"></span>
                <span class="brand-tag mono-xs">Video Experience</span>
            </a>
            <a class="header-link" href="index.html"><span class="hx"></span><span class="roll"><span>Volver al inicio</span></span></a>
        </div>
    </header>

    <main class="flow">
        <aside class="flow-aside theme-dark">
            <div class="photo-bg" aria-hidden="true"></div>
            <span class="logo logo-bg" aria-hidden="true"></span>
            <span class="eyebrow mono-xs rv" style="--d:60ms"><span class="hx"></span><b>Invitación</b> · Estado</span>
            <h1 class="flow-title status-title rv-words">
                <span class="w"><span style="--i:0">Verificar</span></span>
                <span class="w hl"><span style="--i:1">Estado</span></span>
            </h1>
            <p class="flow-lead status-subtitle rv" style="--d:320ms">Ingresá tu DNI para consultar el estado</p>
        </aside>

        <section class="flow-main theme-light">
            <div class="flow-main-inner rv" style="--d:200ms">
                <form id="statusForm">
                    <div class="field">
                        <label class="field-label mono-xs" for="invitationId">DNI</label>
                        <input type="text" class="input" id="invitationId" required placeholder="12345678" maxlength="8" inputmode="numeric">
                    </div>

                    <button type="submit" class="btn-plate is-block btn-check" id="btnCheck" style="margin-top:24px"><span class="roll"><span class="lbl">Verificar Estado</span></span><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10h12M12 6l4 4-4 4"/></svg></button>

                    <div class="error-message" id="errorMessage" role="alert">
                        DNI no encontrado. Verificá que el número sea correcto.
                    </div>
                </form>

                <div class="result-box" id="resultBox" aria-live="polite">
                    <div class="result-head result-status">
                        <span class="mono-xs">Estado</span>
                        <span class="status-badge" id="statusBadge">Pendiente</span>
                    </div>

                    <div class="result-details">
                        <div class="detail-row">
                            <span class="detail-label">Nombre</span>
                            <span class="detail-value" id="guestName">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Invitado por</span>
                            <span class="detail-value" id="hostName">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Fecha de registro</span>
                            <span class="detail-value" id="registrationDate">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/culture.js" defer></script>

    <script>
        // URL del Google Apps Script
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzzDvVpREeMIozrq07Jz4HFaA8-BkIDHqrLFKrZS8RDfdoRE6M8Vx1u5Bd2-lHBpGrZA/exec';

        document.getElementById('statusForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btnCheck = document.getElementById('btnCheck');
            const btnLabel = btnCheck.querySelector('.lbl');
            const errorMessage = document.getElementById('errorMessage');
            const resultBox = document.getElementById('resultBox');

            btnCheck.disabled = true;
            btnLabel.textContent = 'Verificando...';
            errorMessage.style.display = 'none';
            resultBox.style.display = 'none';

            const invitationId = document.getElementById('invitationId').value.trim();

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?id=${encodeURIComponent(invitationId)}`, {
                    method: 'GET',
                    redirect: 'follow'
                });
                const text = await response.text();
                const data = JSON.parse(text);

                if (data.success && data.invitation) {
                    // Mostrar datos
                    const inv = data.invitation;

                    document.getElementById('guestName').textContent = `${inv.firstName} ${inv.lastName}`;
                    document.getElementById('hostName').textContent = inv.hostName;

                    const regDate = new Date(inv.registrationDate);
                    document.getElementById('registrationDate').textContent = regDate.toLocaleDateString('es-AR');

                    // Status badge
                    const statusBadge = document.getElementById('statusBadge');
                    statusBadge.textContent = inv.status;
                    statusBadge.className = 'status-badge';

                    if (inv.status.toLowerCase().includes('aprobad') || inv.status.toLowerCase().includes('confirmad')) {
                        statusBadge.classList.add('status-approved');
                    } else if (inv.status.toLowerCase().includes('rechazad') || inv.status.toLowerCase().includes('cancelad')) {
                        statusBadge.classList.add('status-rejected');
                    } else {
                        statusBadge.classList.add('status-pending');
                    }

                    resultBox.style.display = 'block';

                } else {
                    errorMessage.style.display = 'block';
                }

            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = 'Error de conexión. Verificá tu internet e intentá nuevamente.';
                errorMessage.style.display = 'block';
            } finally {
                btnCheck.disabled = false;
                btnLabel.textContent = 'Verificar Estado';
            }
        });

        // Validar que DNI sea solo números
        document.getElementById('invitationId').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
