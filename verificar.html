<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Estado — CULTURE VIDEO EXPERIENCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --earth: #8B7355;
            --terracotta: #C17A5C;
            --sand: #E8DCC4;
            --beige: #D4C4A8;
            --cream: #F5F1E8;
            --forest: #1A2F1A;
            --forest-light: #2D4A2D;
            --sage: #9CAF88;
            --white: #FFFFFF;
            --warm-white: #FAF8F3;
            
            --font-body: 'Montserrat', sans-serif;
            --font-elegant: 'Playfair Display', serif;
        }

        body {
            font-family: var(--font-body);
            background: var(--forest);
            color: var(--cream);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hero-bg-image {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(135deg, rgba(193, 122, 92, 0.15) 0%, rgba(212, 196, 168, 0.15) 100%),
                url('https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1920&q=80');
            background-size: cover;
            background-position: center;
            filter: saturate(1.4) brightness(0.7);
        }

        .hero-bg-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(26, 47, 26, 0.5) 0%,
                rgba(26, 47, 26, 0.88) 50%,
                rgba(26, 47, 26, 0.95) 100%
            );
        }

        .status-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .status-card {
            background: rgba(26, 47, 26, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .status-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .status-title {
            font-family: var(--font-body);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--beige);
            margin-bottom: 0.5rem;
        }

        .status-subtitle {
            font-family: var(--font-elegant);
            font-size: 1rem;
            font-style: italic;
            color: var(--sage);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--beige);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(26, 47, 26, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: var(--cream);
            font-family: var(--font-body);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .form-input::placeholder {
            color: var(--sage);
            text-transform: none;
            letter-spacing: normal;
        }

        .form-input:focus {
            background: rgba(45, 74, 45, 0.7);
            border-color: var(--beige);
            box-shadow: 0 0 0 3px rgba(212, 196, 168, 0.1);
        }

        .btn-check {
            width: 100%;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.95);
            color: var(--forest);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-top: 1rem;
        }

        .btn-check:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 1);
        }

        .btn-check:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-box {
            display: none;
            margin-top: 2rem;
            padding: 2rem;
            background: rgba(45, 74, 45, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .result-status {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(255, 165, 0, 0.2);
            border: 1px solid rgba(255, 165, 0, 0.5);
            color: #FFB347;
        }

        .status-approved {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #81C784;
        }

        .status-rejected {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            color: #E57373;
        }

        .result-details {
            display: grid;
            gap: 0.8rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-label {
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: var(--sage);
        }

        .detail-value {
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--cream);
            text-align: right;
        }

        .error-message {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            border-radius: 6px;
            color: #E57373;
            font-family: var(--font-body);
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .hero {
                padding: 2rem 1.5rem;
            }

            .status-card {
                padding: 2rem 1.5rem;
            }

            .status-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-bg">
            <div class="hero-bg-image"></div>
            <div class="hero-bg-overlay"></div>
        </div>

        <div class="status-container">
            <div class="status-card">
                <div class="status-header">
                    <h1 class="status-title">Verificar Estado</h1>
                    <p class="status-subtitle">Ingresá tu DNI para consultar el estado</p>
                </div>

                <form id="statusForm">
                    <div class="form-group">
                        <label class="form-label" for="invitationId">DNI</label>
                        <input type="text" class="form-input" id="invitationId" required placeholder="12345678" maxlength="8">
                    </div>

                    <button type="submit" class="btn-check" id="btnCheck">Verificar Estado</button>

                    <div class="error-message" id="errorMessage">
                        DNI no encontrado. Verificá que el número sea correcto.
                    </div>
                </form>

                <div class="result-box" id="resultBox">
                    <div class="result-status">
                        <span class="status-badge" id="statusBadge">Pendiente</span>
                    </div>
                    
                    <div class="result-details">
                        <div class="detail-row">
                            <span class="detail-label">Nombre</span>
                            <span class="detail-value" id="guestName">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Invitado por</span>
                            <span class="detail-value" id="hostName">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Fecha de registro</span>
                            <span class="detail-value" id="registrationDate">-</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </section>

    <script>
        // URL del Google Apps Script
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsyfZIu901lnbju1oEujOdmxQi4bg8X-ah4ke_tIx_F_XxM_ahZltox4TMhrsOXn7w/exec';

        document.getElementById('statusForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btnCheck = document.getElementById('btnCheck');
            const errorMessage = document.getElementById('errorMessage');
            const resultBox = document.getElementById('resultBox');
            
            btnCheck.disabled = true;
            btnCheck.textContent = 'Verificando...';
            errorMessage.style.display = 'none';
            resultBox.style.display = 'none';
            
            const invitationId = document.getElementById('invitationId').value.trim();
            
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?id=${encodeURIComponent(invitationId)}`, {
                    method: 'GET',
                    redirect: 'follow'
                });
                const text = await response.text();
                const data = JSON.parse(text);
                
                if (data.success && data.invitation) {
                    // Mostrar datos
                    const inv = data.invitation;
                    
                    document.getElementById('guestName').textContent = `${inv.firstName} ${inv.lastName}`;
                    document.getElementById('hostName').textContent = inv.hostName;
                    
                    const regDate = new Date(inv.registrationDate);
                    document.getElementById('registrationDate').textContent = regDate.toLocaleDateString('es-AR');
                    
                    // Status badge
                    const statusBadge = document.getElementById('statusBadge');
                    statusBadge.textContent = inv.status;
                    statusBadge.className = 'status-badge';
                    
                    if (inv.status.toLowerCase().includes('aprobad') || inv.status.toLowerCase().includes('confirmad')) {
                        statusBadge.classList.add('status-approved');
                    } else if (inv.status.toLowerCase().includes('rechazad') || inv.status.toLowerCase().includes('cancelad')) {
                        statusBadge.classList.add('status-rejected');
                    } else {
                        statusBadge.classList.add('status-pending');
                    }
                    

                    
                    resultBox.style.display = 'block';
                    
                } else {
                    errorMessage.style.display = 'block';
                }
                
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = 'Error de conexión. Verificá tu internet e intentá nuevamente.';
                errorMessage.style.display = 'block';
            } finally {
                btnCheck.disabled = false;
                btnCheck.textContent = 'Verificar Estado';
            }
        });

        // Validar que DNI sea solo números
        document.getElementById('invitationId').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
